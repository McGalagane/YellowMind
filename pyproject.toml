[tool.poetry]
name = "yellowmind"
version = "0.1.0"
description = "AI platform for Tour de France stage and GC predictions"
authors = ["McGalagane"]
readme = "README.md"
packages = [{ include = "yellowmind", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg2-binary = "^2.9"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"
ruff = "^0.9.9"
pyright = "^1.1.391"
pre-commit = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests requiring database",
]

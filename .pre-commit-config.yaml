repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Ruff and pyright run from the project environment rather than a pinned
  # pre-commit mirror, so poetry.lock is the single source of truth for their
  # versions. A pinned mirror can drift from the version CI installs, which
  # lets a lint error pass locally and then fail CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyright
        name: pyright
        entry: poetry run pyright
        language: system
        types: [python]
        pass_filenames: false

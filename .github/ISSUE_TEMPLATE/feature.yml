name: Feature
description: YellowMind feature or task issue
title: "[area]: "
labels: []
body:
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - "M1 — Project Foundation"
        - "M2 — Historical Data Ingestion"
        - "M3 — Feature Engineering"
        - "M4 — Rating Engine"
        - "M5 — Prediction Models"
        - "M6 — Simulation Engine"
        - "M7 — REST API"
        - "M8 — Dashboard"
        - "M9 — Evaluation"
        - "M10 — Production"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated complexity
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence — what does this issue achieve?
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed scope and context.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkbox list of verifiable outcomes.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Architecture placement, files to touch, constraints.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue numbers or milestones that must be complete first.
